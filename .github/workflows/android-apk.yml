name: Android APK (Flutter)

on:
  push:
    branches:
      - main   # change if needed

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Java (required for Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 3. Install Flutter 3.11.1 manually (reliable for old versions)
      - name: Setup Flutter 3.11.1
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.11.1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      # 4. Verify setup
      - name: Flutter Doctor
        run: flutter doctor -v

      # 5. Cache pub dependencies
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 6. Get dependencies
      - name: Install dependencies
        run: flutter pub get

      # 7. Analyze (optional but clean practice)
      - name: Analyze project
        run: flutter analyze

      # 8. Build APK (release, unsigned)
      - name: Build Release APK
        run: |
          flutter clean
          flutter build apk --release

      # 9. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7